# Every conformance entry, and what it is for.
#
# A binding enumerates this file rather than a directory. A directory walk that
# finds nothing looks the same as a directory walk that finds everything and
# skips it, and the whole point of the corpus is that a binding cannot quietly
# run less of it than the others. The corpus test asserts both ways: every
# entry named here exists, and every file in validate/ and execute/ is either
# an entry or named under support.
#
# Paths are relative to this file and use forward slashes.

version: 1

# The schema folder the corpus is validated against: its own catalog (the core
# plus fixture actions) and the suite.schema.json generated from it.
schemaRoot: schema

entries:
  # --- validate: the file is refused, at these codes and these positions -----
  
  - kind: validate
    suite: validate/typos.yml
    expectation: validate/typos.expected.json
    description: 'A misspelled key, a misspelled action and a misspelled assertion block.'

  - kind: validate
    suite: validate/silent-assert.yml
    expectation: validate/silent-assert.expected.json
    description: 'An operator typo, which is both an unknown key and an assertion that asserts nothing.'

  - kind: validate
    suite: validate/structure.yml
    expectation: validate/structure.expected.json
    description: 'A wrong type, three missing keys and a parameter the action does not declare.'

  - kind: validate
    suite: validate/shapes.yml
    expectation: validate/shapes.expected.json
    description: 'Wrong types and unresolvable paths at many places in one file, to pin the sort order.'

  - kind: validate
    suite: validate/broken.yml
    expectation: validate/broken.expected.json
    description: 'A file that is not YAML at all.'

  - kind: validate
    suite: validate/not-a-mapping.yml
    expectation: validate/not-a-mapping.expected.json
    description: 'A document that parses but is a list rather than a suite.'

  - kind: validate
    suite: validate/semantics.yml
    expectation: validate/semantics.expected.json
    description: 'Two cases with one name, two steps with one capture, limits out of range and an undeclared meta step.'

  - kind: validate
    suite: validate/meta.yml
    expectation: validate/meta.expected.json
    description: 'A meta cycle, an export no step captures, and two use sites with the wrong parameters.'

  - kind: validate
    suite: validate/deep.yml
    expectation: validate/deep.expected.json
    description: 'Meta steps nested one level past the limit, which is refused for depth rather than for a cycle.'

  - kind: validate
    suite: validate/imports.yml
    expectation: validate/imports.expected.json
    description: 'A library that declares things that run, two shadowed names, a parameter with no value and one nothing reads.'

  - kind: validate
    suite: validate/from-library.yml
    expectation: validate/from-library.expected.json
    description: 'A local declaration reusing an imported name without saying it overrides it.'

  - kind: validate
    suite: validate/overridden.yml
    expectation: validate/overridden.expected.json
    description: 'A parameter given on the command line that the suite does not declare.'
    params:
      regionn: x

  - kind: validate
    suite: validate/bad-import.yml
    expectation: validate/bad-import.expected.json
    description: 'An import that is not YAML, and one that imports the file that imported it.'

  - kind: validate
    suite: validate/dataflow.yml
    expectation: validate/dataflow.expected.json
    description: 'References that resolve to nothing, one read before it is produced, a path outside a capture''s shape, and a pattern one binding cannot run.'

  - kind: validate
    suite: validate/cross-case.yml
    expectation: validate/cross-case.expected.json
    description: 'A capture read from the case that did not produce it.'

  - kind: validate
    suite: validate/case-own.yml
    expectation: validate/case-own.expected.json
    description: 'A case with parameters of its own, reading captures and paths that are not there.'

  - kind: validate
    suite: validate/expressions.yml
    expectation: validate/expressions.expected.json
    description: 'An unknown function, a syntax error inside the braces, and a path outside a capture''s shape.'

  - kind: validate
    suite: validate/stable-vars.yml
    expectation: validate/stable-vars.expected.json
    description: 'Three non-deterministic functions in a vars block, and a function called with no arguments.'

  - kind: validate
    suite: validate/guard.yml
    expectation: validate/guard.expected.json
    description: 'A guard naming a capture no step in the case produces, which would silently disable a cleanup.'

  - kind: validate
    suite: validate/later-guard.yml
    expectation: validate/later-guard.expected.json
    description: 'Clean. A guard may name a capture a later step produces, which is what a cleanup needs.'

  - kind: validate
    suite: validate/unread.yml
    expectation: validate/unread.expected.json
    description: 'A capture nothing reads, which is either a pointless step or a missing assertion.'

  - kind: validate
    suite: validate/empty-assert.yml
    expectation: validate/empty-assert.expected.json
    description: 'An assertion entry with a subject and no comparison, beside a capture nobody reads.'

  - kind: validate
    suite: validate/script-read.yml
    expectation: validate/script-read.expected.json
    description: 'Clean. A script assertion reads the bag directly, and that counts as reading the capture.'

  - kind: validate
    suite: validate/step-assert.yml
    expectation: validate/step-assert.expected.json
    description: 'A step''s own assertions, wrong four ways: a path outside a shape, a silent assertion, an unknown key and an unportable pattern.'

  - kind: validate
    suite: validate/gherkin.yml
    expectation: validate/gherkin.expected.json
    description: 'Keywords out of order, two on one step, an and with nothing before it, and a half-labelled list.'

  - kind: validate
    suite: validate/scenario.yml
    expectation: validate/scenario.expected.json
    description: 'Clean. A case labelled all the way through reads as one scenario.'

  - kind: validate
    suite: validate/tables.yml
    expectation: validate/tables.expected.json
    description: 'Every table rule broken at once: differing columns, a repeated column, a repeated row, and a step table inside an outline.'

  - kind: validate
    suite: validate/empty-table.yml
    expectation: validate/empty-table.expected.json
    description: 'A step table with no rows, which would run the step no times and say nothing.'

  - kind: validate
    suite: validate/row-scope.yml
    expectation: validate/row-scope.expected.json
    description: 'Clean. A row column is bound for the step that carries the table.'

  - kind: validate
    suite: validate/row-scope-wrong.yml
    expectation: validate/row-scope-wrong.expected.json
    description: 'A path into a table''s capture that forgets the step ran once per row.'

  - kind: validate
    suite: validate/list-capture.yml
    expectation: validate/list-capture.expected.json
    description: 'The same mistake from the other side: a list capture indexed as though it were one result.'

  - kind: validate
    suite: validate/outline.yml
    expectation: validate/outline.expected.json
    description: 'Clean. A scenario outline binds its columns for the whole case.'

  - kind: validate
    suite: validate/hooks.yml
    expectation: validate/hooks.expected.json
    description: 'A hook limit past its ceiling, and a hook capture nothing reads.'

  - kind: validate
    suite: validate/hook-rules.yml
    expectation: validate/hook-rules.expected.json
    description: 'A hook labelled with a Gherkin keyword, a silent assertion in one, and a path outside a shape.'

  - kind: validate
    suite: validate/everywhere.yml
    expectation: validate/everywhere.expected.json
    description: 'A file wrong at all three levels at once, which is what proves the validator does not stop at the first error.'

  - kind: validate
    suite: validate/portability.yml
    expectation: validate/portability.expected.json
    description: 'A step only the PowerShell binding implements, reported only when the portability check asks.'
    binding: rust
    bindingCheck: true

  - kind: validate
    suite: validate/uses-deprecated.yml
    expectation: validate/uses-deprecated.expected.json
    description: 'An action the catalog marks deprecated, which is a warning rather than a refusal.'
    catalogOverlay: validate/_catalog/deprecated.yaml

  - kind: validate
    suite: validate/new-parameter.yml
    expectation: validate/new-parameter.expected.json
    description: 'Clean against an overlay that declares the parameter, which is what makes the catalog the vocabulary rather than a list in the validator.'
    catalogOverlay: validate/_catalog/new-parameter.yaml

  - kind: validate
    suite: validate/input-parameter.yml
    expectation: validate/input-parameter.expected.json
    description: 'Parameters marked input: true have no default on purpose: the script that starts the run supplies them, so E210 does not fire.'

  - kind: validate
    suite: validate/step-why.yml
    expectation: validate/step-why.expected.json
    description: 'Clean. Every kind of step carries a why and a requires: a hook, a meta definition''s step, a meta use site, a case step and a cleanup step.'

  - kind: validate
    suite: validate/step-why-multiline.yml
    expectation: validate/step-why-multiline.expected.json
    description: 'A why that runs onto a second line, which the format refuses as a value of the wrong shape.'

  # --- execute: the run does these things, in this order ---------------------
  - kind: execute
    suite: execute/capture-path-guard.yml
    expectation: execute/capture-path-guard.expected.json
    description: Nested capture guards test presence, not truthiness.

  - kind: execute
    suite: execute/hooks.yml
    expectation: execute/hooks.expected.json
    description: The six phases run in order around two cases, with beforeEach and afterEach once per case.

  - kind: execute
    suite: execute/setup-fails.yml
    expectation: execute/setup-fails.expected.json
    description: A failed suite setup errors every case, runs none of their steps, and the teardown still runs.

  - kind: execute
    suite: execute/case-setup-fails.yml
    expectation: execute/case-setup-fails.expected.json
    description: A failed case setup fails that case only, its cleanup still runs, and the next case is unaffected.

  - kind: execute
    suite: execute/hung-step.yml
    expectation: execute/hung-step.expected.json
    description: A step that would run for half a minute is cancelled at its own one-second limit, and the cleanup still runs.
    maxSeconds: 20

  - kind: execute
    suite: execute/meta.yml
    expectation: execute/meta.expected.json
    description: A meta step expands at each use site, with its parameters bound and its own steps named.

  - kind: execute
    suite: execute/meta-from-library.yml
    expectation: execute/meta-from-library.expected.json
    description: "A meta step from a library the suite imports expands at each use site, with the library's default or the use site's argument, and returns what it exports."

  - kind: execute
    suite: execute/params.yml
    expectation: execute/params.expected.json
    description: A parameter takes its value from the highest level that names it, the command line first.
    params:
      fromCommandLine: the-command-line

  - kind: execute
    suite: execute/capture-scope.yml
    expectation: execute/capture-scope.expected.json
    description: A capture belongs to the case that produced it, and what the suite setup captured reaches every case.

  - kind: execute
    suite: execute/tags.yml
    expectation: execute/tags.expected.json
    description: A tag filter selects both wanted cases, including a formerly reserved budget tag, and skips only the unwanted case.
    tags: wanted

  - kind: execute
    suite: execute/teardown-fails.yml
    expectation: execute/teardown-fails.expected.json
    description: A teardown that fails is its own report entry and fails the run, without changing the result of a case that passed.

  - kind: execute
    suite: execute/gherkin.yml
    expectation: execute/gherkin.expected.json
    description: A scenario reads as one, a table runs a step once per row in row order, an outline names its entries by their columns, and a failure carries the keyword and the sentence.

  - kind: execute
    suite: execute/nothing-selected.yml
    expectation: execute/nothing-selected.expected.json
    description: A tag filter that selects no case skips every case and runs neither the suite setup nor the teardown.
    tags: selected-by-nobody

  # pendingIn names the runtimes that do not meet an entry yet. Such a runtime
  # reports the entry as pending, never as passed, and removes itself from the
  # list in the change that makes it pass. Every runtime implements
  # fixture.append in its corpus test extension before it removes itself.
  - kind: execute
    suite: execute/capture-isolation.yml
    expectation: execute/capture-isolation.expected.json
    description: A nested value an action changes in place stays changed in its own case only; the next case and the teardown read the setup's value.

  # docs/packages, stage K0: the name filter, run progress, the action worker and
  # bdd-suite:core (spec/README.md, spec/progress.md). Every runtime is pending
  # until its stage (K1 C#, K2 Go, K3 Rust, K4 TypeScript, K5 PowerShell) and
  # removes itself from pendingIn in that change; C# did in K1, Go in K2, Rust in K3. The fields they add:
  #   names       the --name globs the run is given, in the command line's form
  #   progress    run with --progress and compare the progress lines with this
  #               file, masked as spec/progress.md says
  #   schemaRoot  validate or run against this schema folder, not the corpus's
  - kind: execute
    suite: execute/names.yml
    expectation: execute/names.expected.json
    description: A name filter of two globs selects the cases either matches, and skips the rest with reason tag.
    names: '*-an-order,order-?'
    pendingIn: [powershell, typescript]

  - kind: execute
    suite: execute/names-and-tags.yml
    expectation: execute/names-and-tags.expected.json
    description: A case runs only when both the name filter and the tag filter select it.
    names: '*-order'
    tags: wanted
    pendingIn: [powershell, typescript]

  - kind: execute
    suite: execute/names-none.yml
    expectation: execute/names-none.expected.json
    description: A name filter that selects no case skips every case and runs neither the suite setup nor the teardown.
    names: 'nothing-*'
    pendingIn: [powershell, typescript]

  - kind: execute
    suite: execute/progress.yml
    expectation: execute/progress.expected.json
    description: Progress lines follow the run around a passing and a failing case, and the trace is the one a run without them writes.
    names: 'the-*-case'
    progress: execute/progress.expected.txt
    pendingIn: [powershell, typescript]

  # fixture.throw, which each runtime's corpus test extension implements before
  # it removes itself, as it did fixture.append.
  - kind: execute
    suite: execute/worker-throws.yml
    expectation: execute/worker-throws.expected.json
    description: An action that throws its language's most unusual failure fails its step, and the cleanup, the next case and the teardown still run.
    pendingIn: [powershell, typescript]

  - kind: execute
    suite: execute/core-import.yml
    expectation: execute/core-import.expected.json
    description: Core actions read through bdd-suite:core run as they do through a path import.
    schemaRoot: schema-core-import
    pendingIn: [powershell, typescript]

  - kind: validate
    suite: validate/core-import.yml
    expectation: validate/core-import.expected.json
    description: A catalog that imports bdd-suite:core and supports only csharp leaves no core action to the go binding.
    schemaRoot: schema-core-import
    binding: go
    bindingCheck: true
    pendingIn: [powershell, typescript]

support:
  # Libraries the validate entries import, and catalog overlays they validate
  # against. They have no expectation of their own: what they are for is what
  # the entry that names them reports.
  - validate/_lib/library.yml
  - validate/_lib/runs-things.yml
  - validate/_lib/full.yml
  - validate/_lib/bad.yml
  - validate/_catalog/deprecated.yaml
  - validate/_catalog/new-parameter.yaml
  # The library execute/meta-from-library.yml imports.
  - execute/_lib/marks.yml

lists:
  # suiterun list with a name filter (spec/README.md, "The command line"): the
  # case names it prints, in order, from its "<file name>  <case name>" lines. A
  # separate list rather than entries, so a runtime without --name yet reads
  # nothing new; pending as the K0 entries above are.
  - suite: execute/names.yml
    names: '*-an-order,order-?'
    expected: [place-an-order, cancel-an-order, order-1]
    description: 'Two globs, a star and a question mark; the file order.'
    pendingIn: [powershell, typescript]

  - suite: execute/names-and-tags.yml
    names: '*-order'
    tags: wanted
    expected: [a-wanted-order]
    description: 'Only what both filters select.'
    pendingIn: [powershell, typescript]

generate:
  # suiterun generate --plan (spec/test-plan.md): the plan a config must produce,
  # or the refusal it must end in. A separate list rather than entries, so a
  # runtime that has no generator yet reads nothing new. Every runtime is
  # pending until its generator lands (docs/test-providers, stages T2 and
  # T4-T7), and removes itself from pendingIn in that change.
  - config: generate/bddsuite.tests.yaml
    expected: generate/plan.expected.json
    exitCode: 0
    description: 'Names that sanitise alike in a suite and across suites, a reserved identifier, leading digits, no word at all, a non-ASCII letter, colliding outline rows, a library left out, an excluded folder, and a suite guarded through an imported meta step and a polled step.'

  - config: generate/invalid/bddsuite.tests.yaml
    exitCode: 2
    diagnostics:
      - { file: suites/b-broken.yml, code: E104, line: 8, column: 17 }
    description: 'A suite that does not lint clean stops the whole plan, though the file before it is fine: exit 2, the finding, nothing written.'

tables:
  # Two tables that are the specification rather than a description of one.
  - kind: expressions
    context: expressions/context.yaml
    cases: expressions/cases.yaml
    description: 'Every function, operator, precedence rule, coercion and refusal of the expression language, evaluated against one fixed context.'

  - kind: asserts
    cases: asserts/cases.yaml
    description: 'Every assertion operator against every operand pair that says something, stated as pass, fail or a diagnostic code.'
reports:
  # How two reports are compared, and the canonical form of three runs in both
  # formats. A report says which cases passed; the trace beside it says how.
  definition: report/canonicalise.md
  entries:
    - suite: execute/hooks.yml
      format: NUnit3
      expected: report/hooks.nunit3.expected.xml
      description: 'A run where everything passed, in NUnit 3.'
    - suite: execute/hooks.yml
      format: JUnit
      expected: report/hooks.junit.expected.xml
      description: 'The same run in JUnit, which names the same cases with different elements.'
    - suite: execute/tags.yml
      format: NUnit3
      expected: report/tags.nunit3.expected.xml
      description: 'A run where only the unwanted case is skipped; the former budget tag runs normally.'
      tags: wanted
    - suite: execute/tags.yml
      format: JUnit
      expected: report/tags.junit.expected.xml
      description: 'The same run in JUnit, where a skip is an element rather than a result.'
      tags: wanted
    - suite: execute/gherkin.yml
      format: NUnit3
      expected: report/gherkin.nunit3.expected.xml
      description: 'A run with a failing case, whose message names the step that failed.'
    - suite: execute/gherkin.yml
      format: JUnit
      expected: report/gherkin.junit.expected.xml
      description: 'The same run in JUnit.'
    - suite: execute/teardown-fails.yml
      format: NUnit3
      expected: report/teardown-fails.nunit3.expected.xml
      description: 'A run whose cases passed and whose teardown did not, which is one entry more than it has cases.'
