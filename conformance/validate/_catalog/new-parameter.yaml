# Merged over test/e2e/schema/actions.catalog.yaml by action name, so that the
# rule "the catalog is the vocabulary" can be proved with a parameter the
# committed catalog does not declare.
#
# Merge rule: for each action named here, every key given replaces the key in
# the committed catalog, and a params entry replaces the one with the same name
# or is appended when there is none.
actions:
  - name: fixture.suspend
    params:
      - { name: newParameter, type: string, description: Declared only by this overlay. }
