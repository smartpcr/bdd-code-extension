[package]
name = "tp-spike"
version = "0.1.0"
edition = "2024"
publish = false

# Throw-away spike: libtest-mimic as a generated BDD harness.
[dependencies]
libtest-mimic = "=0.8.2"

# Generated BDD harness (no #[test], libtest-mimic provides main's behaviour).
[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false

# Ordinary libtest integration test, to check coexistence (Q5).
[[test]]
name = "plain"
path = "tests/plain.rs"
