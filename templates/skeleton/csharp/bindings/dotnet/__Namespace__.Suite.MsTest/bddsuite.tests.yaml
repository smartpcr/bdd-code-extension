# The {{name}} suites as MSTest tests, generated at every build. The provider is
# not named: the build detects MSTest from the project's package references.
# Paths are relative to this file.
suites:
  - ../../../suites/*.yml
schemaRoot: ../../../schema
extensions: [ {{Namespace}}.Suite.{{Namespace}}Extension ]
# What runs without a real environment; keep it the same as .vscode/settings.json's
# bddSuite.offlineActions. A suite using any other action is guarded: its tests
# skip unless BDD_SUITE_ALLOW_GUARDED=1.
offlineActions: {{offlineActions}}
output: { namespace: {{Namespace}}.Suite.MsTest }
