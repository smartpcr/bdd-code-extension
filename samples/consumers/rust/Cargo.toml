# A consumer of the bdd-suite crate (docs/packages, E4): suiterun by version,
# with no path into this repository, its own extension and suiterun, and its
# suites as cargo test tests. run-e4.ps1 builds it against the crate that
# scripts/local-feeds.ps1 packs.
[package]
name = "greeter"
version = "0.1.0"
edition = "2021"
publish = false

# Its own workspace, so it builds standalone wherever it is copied.
[workspace]

[dependencies]
suiterun = { version = "0.7.4", features = ["testing"] }
serde_json = "1"

[build-dependencies]
suiterun = { version = "0.7.4", features = ["testing"] }

# Its own suiterun: the runtime's command line with its extension.
[[bin]]
name = "suiterun"
path = "src/main.rs"

# Its suites as cargo test tests, from the list build.rs generates.
[[test]]
name = "suites"
path = "tests/suites.rs"
harness = false
