# A large suite: twenty cases of six steps (120 steps), about a thousand lines.
# The editor's live-lint latency test edits it; it is lint clean and runs in
# every binding, using only actions all five implement.
suite: large
owner: storefront
description: Twenty products, each checked, carted, shipped and confirmed.
tags: [large]
defaults:
  timeoutSec: 60
params:
  - { name: customerId, type: string, default: G-1, description: The customer every case serves. }
tests:
  - name: product-01-apple
    description: APPLE from shelf to parcel.
    tags: [product, batch-0]
    steps:
      - given: the stock of APPLE is read
        why: the cart may only hold what is on hand
        action: inventory.get
        sku: APPLE
        captureAs: stock
      - and: APPLE is in stock
        action: core.noop
        asserts:
          - var: stock.inStock
            equals: true
          - var: stock.quantity
            equals: 50
      - when: 1 of APPLE go in the cart
        why: the quantity cycles from one to four across the products
        action: cart.add
        sku: ${capture.stock.sku}
        quantity: 1
        captureAs: line
      - and: the customer is looked up
        why: the tier decides nothing here, but the summary names the customer
        action: customer.lookup
        id: ${param.customerId}
        captureAs: customer
      - and: a 1 kilogram parcel is quoted standard
        why: odd products ship express, even ones standard
        action: shipping.quote
        weightKg: 1
        policy: Standard
        captureAs: shipping
      - then: the order summary reads right
        why: one text joins what the three earlier steps captured
        action: core.set
        value: ${capture.line.line} for ${capture.customer.name} by ${capture.shipping.policy}
        captureAs: summary
        asserts:
          - var: summary
            equals: APPLEx1 for Customer G-1 by Standard
          - var: shipping.cost
            equals: 5
          - var: customer.tier
            equals: gold
    asserts:
      - var: line.quantity
        equals: 1
      - var: line.sku
        equals: APPLE
