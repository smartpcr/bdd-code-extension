# The sample workspace's suites as node:test, Vitest and Jest tests
# (docs/test-providers, D12; spec/test-plan.md). ../generate.mjs writes them
# once per provider into ../<provider>/shop.
suites:
  - ../../../test/e2e/suites/*.yml   # not flawed/, which does not lint clean on purpose
  - ../../suites/*.yml               # the local suites every language's sample shares
schemaRoot: ../../../test/e2e/schema
extensions: [ "@bdd-suite-sample/shop-suiterun#shop" ]
contextKeys: [ store ]
# order.place stands in for a lab action: a suite that uses it is guarded and
# skips unless BDD_SUITE_ALLOW_GUARDED=1 (../../suites/order-placement.yml).
offlineActions: [ "core.*", "wait", "inventory.*", "cart.*", "customer.*", "shipping.*", "price.*", "stock.*", "audit.*", "shop.*" ]
