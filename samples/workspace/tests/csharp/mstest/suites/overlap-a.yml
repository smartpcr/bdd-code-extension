suite: overlap-a
description: Three short cases whose markers show, under method-level parallelism, that no two cases of one suite overlap and that beforeEach and afterEach bracket only their own case (docs/test-providers, E11).
tags: [overlap]

beforeEach:
  - action: core.record
    marker: overlap-a:before

afterEach:
  - action: core.record
    marker: overlap-a:after

tests:
  - name: one
    steps:
      - given: the case starts
        action: core.record
        marker: overlap-a:one:start
      - when: it works for a moment
        action: core.sleep
        seconds: 0.2
      - then: it ends
        action: core.record
        marker: overlap-a:one:end
  - name: two
    steps:
      - given: the case starts
        action: core.record
        marker: overlap-a:two:start
      - when: it works for a moment
        action: core.sleep
        seconds: 0.2
      - then: it ends
        action: core.record
        marker: overlap-a:two:end
  - name: three
    steps:
      - given: the case starts
        action: core.record
        marker: overlap-a:three:start
      - when: it works for a moment
        action: core.sleep
        seconds: 0.2
      - then: it ends
        action: core.record
        marker: overlap-a:three:end
