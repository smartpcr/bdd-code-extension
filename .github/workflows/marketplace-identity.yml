# One-time setup helper for publishing without a PAT. Run it by hand (Actions
# -> Marketplace identity -> Run workflow) after the managed identity and its
# federated credential exist and the AZURE_* repository variables are set. It
# signs in as the identity, exactly as the release job does, and prints the
# identity's Visual Studio Marketplace id: add that id to the publisher as a
# member with the Contributor role (marketplace.visualstudio.com/manage ->
# publisher -> Members). It publishes nothing.
name: Marketplace identity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  identity:
    name: Print the publishing identity's Marketplace id
    runs-on: ubuntu-latest
    # The same environment as the release job, so the federated credential's
    # subject (...:environment:marketplace) matches.
    environment: marketplace
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: The identity's Marketplace profile
        run: |
          # 499b84ac-... is Azure DevOps' resource id; the Marketplace knows the identity by this profile's id.
          profile=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798)
          id=$(echo "$profile" | jq -r .id)
          echo "Marketplace id of the publishing identity: $id"
          {
            echo "### Add this identity to the publisher"
            echo
            echo "Marketplace id: \`$id\`"
            echo
            echo "marketplace.visualstudio.com/manage -> publisher -> **Members** -> **Add**: paste the id, role **Contributor**."
          } >> "$GITHUB_STEP_SUMMARY"
