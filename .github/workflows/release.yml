# Release: push a tag v<version> whose version equals package.json's, e.g.
#   git tag v0.4.2 && git push origin v0.4.2
# The CI workflow builds and tests the package; then this one publishes that
# same .vsix to the Visual Studio Marketplace and attaches it, with its
# SHA-256, to a GitHub release.
#
# Needs the repository secret VSCE_PAT: an Azure DevOps personal access token
# with the Marketplace (Manage) scope for the publisher in package.json. The
# publish job runs in the `marketplace` environment, so required reviewers
# set on that environment must approve before anything is published.
#
# Re-running a failed release is safe: a version already on the Marketplace is
# skipped, and an existing GitHub release gets its files replaced.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: The tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Bump the version, commit, and tag v$version."
            exit 1
          fi

  build:
    name: Build and test
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: The package is the one CI built
        run: sha256sum --check bdd-suite-*.vsix.sha256

      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::The repository secret VSCE_PAT is not set; nothing was published."
            exit 1
          fi
          npx --yes @vscode/vsce@3 publish --packagePath bdd-suite-*.vsix --skip-duplicate

      - name: GitHub release with the .vsix and its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" bdd-suite-*.vsix bdd-suite-*.vsix.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" bdd-suite-*.vsix bdd-suite-*.vsix.sha256 \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
