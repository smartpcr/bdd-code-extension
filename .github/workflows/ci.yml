# Build, test and package the extension on every push to main and every pull
# request; release it when a push to main carries a new version.
#
# Releasing is automatic: bump `version` in package.json and push to main.
# When the build passes and no tag v<version> exists yet, the release job
# creates the GitHub release v<version> (which creates the tag) with the very
# .vsix this run built and tested and its SHA-256, and tags the Go module
# runtimes/go/v<version> at the same commit. Nothing is published to a
# marketplace, so the job needs no credentials beyond the run's own token. A
# push that keeps the version only builds and tests. Re-running a failed
# release is safe: an existing GitHub release gets its files replaced.
#
# The extension builds and its demo and integration suite run on Windows, where
# it is developed and used; both are self-contained (the integration suite runs
# against samples/workspace, whose bindings it builds from runtimes/).
#
# Each runtime's job runs its unit tests and the whole corpus, which includes
# the suite session (E1), the whole-file run rebuilt on it (E2) and the test
# plan (E3) of docs/test-providers. Each provider job runs the corpus and the
# sample suites through that language's test frameworks and its scenarios
# (E4 to E12), and keeps every framework report and trace as an artifact:
# Windows for C# and PowerShell, Linux for Go, Rust and TypeScript.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests (100% coverage of core, config and tools)
        run: npm run test:unit

      # docs/packages, DEC-P03 (E10): every runtime manifest, and every lock file
      # that records a runtime, carries package.json's version.
      - name: Every runtime is at the extension's version
        run: node scripts/check-versions.mjs

      - name: Package (.vsix, its .sha256, and a check of what the archive holds)
        run: npm run package

      - name: Demo end to end (installs the .vsix into a fresh VS Code and drives it)
        run: npm run test:demo

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          # Both under out/, so the artifact holds them at its root.
          path: |
            out/bdd-suite-*.vsix
            out/bdd-suite-*.vsix.sha256
          if-no-files-found: error

  spec:
    name: Core spec and corpus schemas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: The generator's YAML module
        shell: pwsh
        run: Install-Module powershell-yaml -Scope CurrentUser -Force

      - name: Schema tests (the core, imports, duplicates, cycles, extensions)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'spec/Schema.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Every committed generated schema is current
        shell: pwsh
        run: |
          foreach ($catalog in @('spec/core.catalog.yaml', 'conformance/schema/actions.catalog.yaml', 'conformance/schema-core-import/actions.catalog.yaml', 'runtimes/typescript/example/schema/actions.catalog.yaml',
                                'runtimes/go/example/schema/actions.catalog.yaml', 'runtimes/rust/example/schema/actions.catalog.yaml',
                                'runtimes/csharp/Bdd.Suite.Example/schema/actions.catalog.yaml', 'runtimes/powershell/example/schema/actions.catalog.yaml')) {
            pwsh -NoProfile -File spec/Build-Schema.ps1 -Catalog $catalog -Check
            if ($LASTEXITCODE) { throw "$catalog's generated schema is stale" }
          }

  runtime-typescript:
    name: TypeScript runtime (unit, corpus with E1-E3, extension example)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtimes/typescript
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtimes/typescript/package-lock.json

      - run: npm ci

      - name: Build, unit tests, the whole corpus, coverage gates
        run: npm test

  runtime-go:
    name: Go runtime (unit, corpus with E1-E3, extension example)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtimes/go
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtimes/go/go.mod
          cache-dependency-path: runtimes/go/go.sum

      - run: go vet ./...

      - name: Unit tests, the whole corpus, the extension example (with the race detector, since sessions share a trace)
        run: go test -race ./...

  runtime-rust:
    name: Rust runtime (unit, corpus with E1-E3, extension example)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtimes/rust
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtimes/rust

      - name: Unit tests, the whole corpus, the extension example, and the testing feature's harness
        run: cargo test --features testing

      - name: The crate without the testing feature
        run: cargo build

  runtime-csharp:
    name: C# runtime on Linux (unit, corpus with E1-E3, generator, extension example)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtimes/csharp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet build Bdd.Suite.sln --nologo

      - name: Unit tests, the whole corpus, the extension example
        run: dotnet test Bdd.Suite.sln --no-build --nologo

  runtime-powershell:
    name: PowerShell runtime (unit, corpus with E1-E3, extension example)
    # Windows: where this runtime is developed and verified.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Pester 5 and the YAML module the suite reader mirrors (0.4.12)
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force

      - name: Runtime tests, the whole corpus, the extension example
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'runtimes/powershell'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $config

  providers-csharp:
    name: C# providers (MSTest, NUnit, xUnit) on the corpus and the sample suites
    # E4, E9-E12 and the corpus through each framework (docs/test-providers).
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: npm ci

      - name: The runtime (its suiterun prints the plans) and the sample's binding (the reference run)
        run: |
          dotnet build runtimes/csharp/Bdd.Suite.sln --nologo
          dotnet build samples/workspace/test/e2e/bindings/dotnet/Suite.sln --nologo

      - name: The corpus and the sample suites through each framework
        shell: pwsh
        run: |
          foreach ($provider in 'mstest', 'nunit', 'xunit') {
            node samples/workspace/tests/harness/corpus.mjs --provider $provider --out "out/providers/$provider"
            if ($LASTEXITCODE) { throw "the corpus differs under $provider" }
          }

      - name: Filters, listing, guarded suites, parallel runs, generation (E4, E9-E12)
        shell: pwsh
        run: |
          foreach ($provider in 'mstest', 'nunit', 'xunit') {
            node samples/workspace/tests/csharp/scenarios.mjs --provider $provider
            if ($LASTEXITCODE) { throw "a scenario failed under $provider" }
          }

      - name: Keep the reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-reports-csharp
          path: out/providers
          if-no-files-found: warn

  providers-go:
    name: Go provider (go test) on the corpus and the sample suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: samples/workspace/tests/go/go.mod
          cache-dependency-path: |
            runtimes/go/go.sum
            samples/workspace/tests/go/go.sum
            samples/workspace/test/e2e/bindings/go/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: The committed generated tests are current
        working-directory: samples/workspace/tests/go
        run: |
          for pkg in shop corpus; do (cd "$pkg" && go tool suiterun generate --config bddsuite.tests.yaml --check); done

      - name: The corpus and the sample suites through go test (E5)
        run: node samples/workspace/tests/harness/corpus.mjs --provider go --out out/providers/go

      - name: Filters, listing, guarded suites, parallel runs, generation (E5, E9-E12)
        run: node samples/workspace/tests/go/scenarios.mjs

      - name: Keep the reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-reports-go
          path: out/providers
          if-no-files-found: warn

  providers-rust:
    name: Rust provider (cargo test harness) on the corpus and the sample suites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            samples/workspace/tests/rust
            samples/workspace/test/e2e/bindings/rust
            runtimes/rust

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: The corpus and the sample suites through cargo test (E6)
        run: node samples/workspace/tests/harness/corpus.mjs --provider rust --out out/providers/rust

      - name: Listing, filters, guarded suites, parallel runs, generation (E6, E9-E12)
        run: node samples/workspace/tests/rust/scenarios.mjs

      - name: Keep the reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-reports-rust
          path: out/providers
          if-no-files-found: warn

  providers-typescript:
    name: TypeScript providers (node:test, Vitest, Jest) on the corpus and the sample suites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtimes/typescript/package-lock.json
            samples/workspace/test/e2e/bindings/typescript/package-lock.json
            samples/workspace/tests/typescript/package-lock.json

      - run: npm ci

      - name: The runtime, the sample's binding and the test package
        run: |
          (cd runtimes/typescript && npm ci && npm run build)
          (cd samples/workspace/test/e2e/bindings/typescript && npm ci && npm run build)
          (cd samples/workspace/tests/typescript && npm ci)

      - name: The committed generated tests are current
        working-directory: samples/workspace/tests/typescript
        run: npm run generate:check

      - name: The corpus and the sample suites through each framework (E7)
        run: |
          for provider in node vitest jest mocha; do
            node samples/workspace/tests/harness/corpus.mjs --provider "$provider" --out "out/providers/$provider"
          done

      - name: Filters, listing, guarded suites, parallel runs, generation (E7, E9-E12)
        run: |
          for provider in node vitest jest mocha; do
            node samples/workspace/tests/typescript/scenarios.mjs --provider "$provider"
          done

      - name: Keep the reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-reports-typescript
          path: out/providers
          if-no-files-found: warn

  providers-powershell:
    name: PowerShell provider (Pester) on the corpus and the sample suites
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Pester 5 and the YAML module
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force

      - run: npm ci

      - name: The committed generated tests are current
        shell: pwsh
        run: |
          pwsh -NoProfile -File samples/workspace/tests/powershell/generate.ps1 -Check
          if ($LASTEXITCODE) { throw 'a generated Pester file is stale' }

      - name: The corpus and the sample suites through Pester (E8)
        run: node samples/workspace/tests/harness/corpus.mjs --provider pester --out out/providers/pester

      - name: Filters, discovery, guarded suites, generation (E8, E9, E10, E12)
        run: node samples/workspace/tests/powershell/scenarios.mjs

      - name: Keep the reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-reports-powershell
          path: out/providers
          if-no-files-found: warn

  integration:
    name: Extension integration suite against samples/workspace
    # E4: the extension in a real VS Code against the sample workspace, whose
    # five bindings are built from this commit's runtimes. No os-context.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtimes/go/go.mod
          cache-dependency-path: runtimes/go/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: The PowerShell modules the PowerShell binding needs
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force

      - run: npm ci

      - name: Integration suite (builds the sample's bindings first)
        run: npm run test:integration

  divergence:
    name: The corpus catches a divergent runtime (Go, TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtimes/go/go.mod
          cache-dependency-path: runtimes/go/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtimes/typescript/package-lock.json

      - name: Inject a case-sensitive equals into each runtime; its corpus must fail, then the file is restored
        shell: pwsh
        run: |
          foreach ($binding in 'go', 'typescript') {
            pwsh -NoProfile -File conformance/Assert-DivergenceIsCaught.ps1 -Binding $binding
            if ($LASTEXITCODE) { throw "the divergence check failed for $binding" }
          }
          git diff --exit-code -- runtimes

  version:
    name: Is this version released?
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new; it is released once the build passes."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release v${{ needs.version.outputs.version }}
    needs: [build, spec, runtime-typescript, runtime-go, runtime-rust, runtime-csharp, runtime-powershell, providers-csharp, providers-go,
      providers-rust, providers-typescript, providers-powershell, divergence, integration, version]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TAG: v${{ needs.version.outputs.version }}
      VSIX: bdd-suite-${{ needs.version.outputs.version }}.vsix
    steps:
      # Only the files the release notes read the runtime versions from.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: runtimes

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: The package is the one this run built, at this version
        run: sha256sum --check "$VSIX.sha256"

      # D12, DEC-S09: the notes name what a consumer pinning this tag gets.
      - name: Release notes list the runtime versions
        run: |
          ts=$(node -p "require('./runtimes/typescript/package.json').version")
          api=$(node -p "/apiVersion = '([^']+)'/.exec(require('fs').readFileSync('runtimes/typescript/src/index.ts', 'utf8'))[1]")
          rs=$(sed -n 's/^version = "\(.*\)"/\1/p' runtimes/rust/Cargo.toml | head -1)
          ps=$(sed -n "s/.*ModuleVersion *= *'\(.*\)'.*/\1/p" runtimes/powershell/BddSuite/BddSuite.psd1)
          tick='`'
          {
            echo "## Runtimes in this release"
            echo
            echo "Pin this tag (for example as a git submodule) to get the format spec, the corpus and these runtimes together."
            echo
            echo "| Runtime | Version |"
            echo "| --- | --- |"
            echo "| Go module ${tick}github.com/${GITHUB_REPOSITORY}/runtimes/go${tick} | ${tick}runtimes/go/$TAG${tick} |"
            echo "| Rust crate ${tick}suiterun${tick} | $rs |"
            echo "| C# ${tick}Bdd.Suite${tick} | built from this tag by project reference |"
            echo "| TypeScript ${tick}@bdd-suite/runtime${tick} | $ts (lint API $api) |"
            echo "| PowerShell module ${tick}BddSuite${tick} | $ps |"
            echo
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: GitHub release with the .vsix and its SHA-256 (creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" "$VSIX.sha256" --clobber
          else
            gh release create "$TAG" "$VSIX" "$VSIX.sha256" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi

      # D12, DEC-S09: Go resolves a module in a subdirectory only from a tag with that prefix.
      - name: Tag the Go module at the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          go_tag="runtimes/go/$TAG"
          release_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$go_tag" --jq .object.sha 2> /dev/null); then
            echo "$go_tag already exists at $existing."
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$go_tag" -f sha="$release_sha" > /dev/null
            existing=$release_sha
            echo "Created $go_tag at $release_sha."
          fi
          # E7: both tags name the same commit.
          if [ "$existing" != "$release_sha" ]; then
            echo "::error::$go_tag is at $existing, but $TAG is at $release_sha."
            exit 1
          fi
