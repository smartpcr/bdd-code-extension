# Build, test and package the extension on every push to main and every pull
# request; release it when a push to main carries a new version.
#
# Releasing is automatic: bump `version` in package.json (npm run set-version)
# and push to main. When every gate passes and no tag v<version> exists yet:
# the runtime packages, packed once by the packages job and proved by the
# consumers matrix, go to this repository's GitHub Packages (NuGet and npm)
# and to the public registries the repository variable PUBLIC_REGISTRIES names
# (true for all of nuget.org, npm, crates.io and the PowerShell Gallery, or a
# list such as nuget,npm,crates) in the release environment; then the
# release job creates the GitHub release v<version> (which creates the tag)
# with the very .vsix this run built and tested, its SHA-256 and every package
# file, and tags the Go module runtimes/go/v<version> at the same commit
# (docs/packages, D16, DEC-P10). Every publish step skips a version its
# registry has, and an existing GitHub release gets its files replaced, so a
# failed release is finished by running it again. A pull request, or a push
# that keeps the version, builds, tests and dry-runs the publishing (E10).
#
# The extension builds and its demo and integration suite run on Windows, where
# it is developed and used; both are self-contained (the integration suite runs
# against samples/workspace, whose bindings it builds from runtimes/).
#
# Each runtime's job runs its unit tests and the whole corpus, which includes
# the suite session (E1), the whole-file run rebuilt on it (E2) and the test
# plan (E3) of docs/test-providers. Each provider job runs the corpus and the
# sample suites through that language's test frameworks and its scenarios
# (E4 to E12), and keeps every framework report and trace as an artifact:
# Windows for C# and PowerShell, Linux for Go, Rust and TypeScript.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests (100% coverage of core, config and tools)
        run: npm run test:unit

      # docs/packages, DEC-P03 (E10): every runtime manifest, and every lock file
      # that records a runtime, carries package.json's version.
      - name: Every runtime is at the extension's version
        run: node scripts/check-versions.mjs

      - name: Package (.vsix, its .sha256, and a check of what the archive holds)
        run: npm run package

      - name: Demo end to end (installs the .vsix into a fresh VS Code and drives it)
        run: npm run test:demo

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          # Both under out/, so the artifact holds them at its root.
          path: |
            out/bdd-suite-*.vsix
            out/bdd-suite-*.vsix.sha256
          if-no-files-found: error

  spec:
    name: Core spec and corpus schemas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: The generator's YAML module
        shell: pwsh
        run: Install-Module powershell-yaml -Scope CurrentUser -Force

      - name: Schema tests (the core, imports, duplicates, cycles, extensions)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'spec/Schema.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Every committed generated schema is current
        shell: pwsh
        run: |
          foreach ($catalog in @('spec/core.catalog.yaml', 'conformance/schema/actions.catalog.yaml', 'conformance/schema-core-import/actions.catalog.yaml', 'runtimes/typescript/example/schema/actions.catalog.yaml',
                                'runtimes/go/example/schema/actions.catalog.yaml', 'runtimes/rust/example/schema/actions.catalog.yaml',
                                'runtimes/csharp/Bdd.Suite.Example/schema/actions.catalog.yaml', 'runtimes/powershell/example/schema/actions.catalog.yaml')) {
            pwsh -NoProfile -File spec/Build-Schema.ps1 -Catalog $catalog -Check
            if ($LASTEXITCODE) { throw "$catalog's generated schema is stale" }
          }

  runtime-typescript:
    name: TypeScript runtime (unit, corpus with E1-E3, extension example)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtimes/typescript
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtimes/typescript/package-lock.json

      - run: npm ci

      - name: Build, unit tests, the whole corpus, coverage gates
        run: npm test

  runtime-go:
    name: Go runtime (unit, corpus with E1-E3, extension example)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtimes/go
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtimes/go/go.mod
          cache-dependency-path: runtimes/go/go.sum

      - run: go vet ./...

      - name: Unit tests, the whole corpus, the extension example (with the race detector, since sessions share a trace)
        run: go test -race ./...

  runtime-rust:
    name: Rust runtime (unit, corpus with E1-E3, extension example)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtimes/rust
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtimes/rust

      - name: Unit tests, the whole corpus, the extension example, and the testing feature's harness
        run: cargo test --features testing

      - name: The crate without the testing feature
        run: cargo build

  runtime-csharp:
    name: C# runtime on Linux (unit, corpus with E1-E3, generator, extension example)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtimes/csharp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet build Bdd.Suite.sln --nologo

      - name: Unit tests, the whole corpus, the extension example
        run: dotnet test Bdd.Suite.sln --no-build --nologo

  runtime-powershell:
    name: PowerShell runtime (unit, corpus with E1-E3, extension example)
    # Windows: where this runtime is developed and verified.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Pester 5 and the YAML module the suite reader mirrors (0.4.12)
        shell: pwsh
        run: |
          # Pester 5, which these tests are written for (6.x is on the Gallery now); a Gallery download fails now and then, so try three times.
          foreach ($attempt in 1..3) {
            try {
              Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
              Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "attempt ${attempt}: $_"; Start-Sleep -Seconds (10 * $attempt)
            }
          }

      - name: Runtime tests, the whole corpus, the extension example
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'runtimes/powershell'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $config

  providers-csharp:
    name: C# providers (MSTest, NUnit, xUnit) on the corpus and the sample suites
    # E4, E9-E12 and the corpus through each framework (docs/test-providers).
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: npm ci

      - name: The runtime (its suiterun prints the plans) and the sample's binding (the reference run)
        run: |
          dotnet build runtimes/csharp/Bdd.Suite.sln --nologo
          dotnet build samples/workspace/test/e2e/bindings/dotnet/Suite.sln --nologo

      - name: The corpus and the sample suites through each framework
        shell: pwsh
        run: |
          foreach ($provider in 'mstest', 'nunit', 'xunit') {
            node samples/workspace/tests/harness/corpus.mjs --provider $provider --out "out/providers/$provider"
            if ($LASTEXITCODE) { throw "the corpus differs under $provider" }
          }

      - name: Filters, listing, guarded suites, parallel runs, generation (E4, E9-E12)
        shell: pwsh
        run: |
          foreach ($provider in 'mstest', 'nunit', 'xunit') {
            node samples/workspace/tests/csharp/scenarios.mjs --provider $provider
            if ($LASTEXITCODE) { throw "a scenario failed under $provider" }
          }

      - name: Keep the reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-reports-csharp
          path: out/providers
          if-no-files-found: warn

  providers-go:
    name: Go provider (go test) on the corpus and the sample suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: samples/workspace/tests/go/go.mod
          cache-dependency-path: |
            runtimes/go/go.sum
            samples/workspace/tests/go/go.sum
            samples/workspace/test/e2e/bindings/go/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: The committed generated tests are current
        working-directory: samples/workspace/tests/go
        run: |
          for pkg in shop corpus; do (cd "$pkg" && go tool suiterun generate --config bddsuite.tests.yaml --check); done

      - name: The corpus and the sample suites through go test (E5)
        run: node samples/workspace/tests/harness/corpus.mjs --provider go --out out/providers/go

      - name: Filters, listing, guarded suites, parallel runs, generation (E5, E9-E12)
        run: node samples/workspace/tests/go/scenarios.mjs

      - name: Keep the reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-reports-go
          path: out/providers
          if-no-files-found: warn

  providers-rust:
    name: Rust provider (cargo test harness) on the corpus and the sample suites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            samples/workspace/tests/rust
            samples/workspace/test/e2e/bindings/rust
            runtimes/rust

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: The corpus and the sample suites through cargo test (E6)
        run: node samples/workspace/tests/harness/corpus.mjs --provider rust --out out/providers/rust

      - name: Listing, filters, guarded suites, parallel runs, generation (E6, E9-E12)
        run: node samples/workspace/tests/rust/scenarios.mjs

      - name: Keep the reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-reports-rust
          path: out/providers
          if-no-files-found: warn

  providers-typescript:
    name: TypeScript providers (node:test, Vitest, Jest) on the corpus and the sample suites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtimes/typescript/package-lock.json
            samples/workspace/test/e2e/bindings/typescript/package-lock.json
            samples/workspace/tests/typescript/package-lock.json

      - run: npm ci

      - name: The runtime, the sample's binding and the test package
        run: |
          (cd runtimes/typescript && npm ci && npm run build)
          (cd samples/workspace/test/e2e/bindings/typescript && npm ci && npm run build)
          (cd samples/workspace/tests/typescript && npm ci)

      - name: The committed generated tests are current
        working-directory: samples/workspace/tests/typescript
        run: npm run generate:check

      - name: The corpus and the sample suites through each framework (E7)
        run: |
          for provider in node vitest jest mocha; do
            node samples/workspace/tests/harness/corpus.mjs --provider "$provider" --out "out/providers/$provider"
          done

      - name: Filters, listing, guarded suites, parallel runs, generation (E7, E9-E12)
        run: |
          for provider in node vitest jest mocha; do
            node samples/workspace/tests/typescript/scenarios.mjs --provider "$provider"
          done

      - name: Keep the reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-reports-typescript
          path: out/providers
          if-no-files-found: warn

  providers-powershell:
    name: PowerShell provider (Pester) on the corpus and the sample suites
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Pester 5 and the YAML module
        shell: pwsh
        run: |
          # Pester 5, which these tests are written for (6.x is on the Gallery now); a Gallery download fails now and then, so try three times.
          foreach ($attempt in 1..3) {
            try {
              Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
              Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "attempt ${attempt}: $_"; Start-Sleep -Seconds (10 * $attempt)
            }
          }

      - run: npm ci

      - name: The committed generated tests are current
        shell: pwsh
        run: |
          pwsh -NoProfile -File samples/workspace/tests/powershell/generate.ps1 -Check
          if ($LASTEXITCODE) { throw 'a generated Pester file is stale' }

      - name: The corpus and the sample suites through Pester (E8)
        run: node samples/workspace/tests/harness/corpus.mjs --provider pester --out out/providers/pester

      - name: Filters, discovery, guarded suites, generation (E8, E9, E10, E12)
        run: node samples/workspace/tests/powershell/scenarios.mjs

      - name: Keep the reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-reports-powershell
          path: out/providers
          if-no-files-found: warn

  integration:
    name: Extension integration suite against samples/workspace
    # E4: the extension in a real VS Code against the sample workspace, whose
    # five bindings are built from this commit's runtimes. No os-context.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtimes/go/go.mod
          cache-dependency-path: runtimes/go/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: The PowerShell modules the PowerShell binding needs
        shell: pwsh
        run: |
          # Pester 5, which these tests are written for (6.x is on the Gallery now); a Gallery download fails now and then, so try three times.
          foreach ($attempt in 1..3) {
            try {
              Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
              Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "attempt ${attempt}: $_"; Start-Sleep -Seconds (10 * $attempt)
            }
          }

      - run: npm ci

      - name: Integration suite (builds the sample's bindings first)
        run: npm run test:integration

  divergence:
    name: The corpus catches a divergent runtime (Go, TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtimes/go/go.mod
          cache-dependency-path: runtimes/go/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtimes/typescript/package-lock.json

      - name: Inject a case-sensitive equals into each runtime; its corpus must fail, then the file is restored
        shell: pwsh
        run: |
          foreach ($binding in 'go', 'typescript') {
            pwsh -NoProfile -File conformance/Assert-DivergenceIsCaught.ps1 -Binding $binding
            if ($LASTEXITCODE) { throw "the divergence check failed for $binding" }
          }
          git diff --exit-code -- runtimes

  # docs/packages, K7.6: the workflow parses and lints clean, shell scripts included.
  workflow:
    name: The workflow lints clean (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: actionlint 1.7.7 (with shellcheck, which the runner has)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  version:
    name: Is this version released?
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      # The public registries a release publishes to, and the consumers that prove them (scripts/publish/registries.mjs).
      registries: ${{ steps.registries.outputs.registries }}
      verify: ${{ steps.registries.outputs.verify }}
    steps:
      - uses: actions/checkout@v5

      - name: The public registries (the repository variable PUBLIC_REGISTRIES)
        id: registries
        env:
          PUBLIC_REGISTRIES: ${{ vars.PUBLIC_REGISTRIES }}
        run: node scripts/publish/registries.mjs

      - id: check
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new; it is released once the build passes."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # docs/packages, D16. Every package is packed once, on every run, and checked
  # against its expected contents (E1); the consumers matrix proves each from
  # those very files (E2 to E6). On a release the C# packages go to this
  # repository's GitHub Packages feed and every package file to the GitHub
  # release (the user's decision, 2026-10-20: the repository and its feed
  # first). The public registries (nuget.org, npm, crates.io, the Gallery) are
  # published to only as the repository variable PUBLIC_REGISTRIES names them
  # (true for all, or a list), in the release environment; otherwise, and on
  # every pull request, their
  # publish steps run as a dry run (E10). Everything is published before the
  # GitHub release and the Go tag exist, so a release never names a package
  # that is not there (DEC-P10).
  packages:
    name: Every package, packed once and checked (E1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtimes/go/go.mod
          cache-dependency-path: runtimes/go/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Publish-PSResource needs the YAML module the BddSuite manifest requires;
      # local-feeds puts the same module into the file repository beside BddSuite.
      - name: The YAML module the PowerShell module requires
        shell: pwsh
        run: Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force

      - name: Pack every package into the local feeds, check each against packaging/, and gather the release's files
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/pack-all.ps1
          if ($LASTEXITCODE) { throw 'packing failed' }

      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*
          if-no-files-found: error

      # The feeds the consumers install from, so they prove the files above, not a pack of their own.
      - name: Keep the local feeds
        uses: actions/upload-artifact@v4
        with:
          name: feeds
          path: artifacts/feeds
          if-no-files-found: error

  consumers:
    name: ${{ matrix.label }} consumer from the packages alone (${{ matrix.scenario }})
    needs: packages
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: csharp, label: 'C#', scenario: E2, os: windows-latest, script: samples/consumers/csharp/run-e2.ps1 }
          - { language: go, label: Go, scenario: E3, os: ubuntu-latest, script: samples/consumers/go/run-e3.ps1 }
          - { language: rust, label: Rust, scenario: E4, os: ubuntu-latest, script: samples/consumers/rust/run-e4.ps1 }
          - { language: typescript, label: TypeScript, scenario: E5, os: ubuntu-latest, script: samples/consumers/typescript/run-e5.ps1 }
          - { language: powershell, label: PowerShell, scenario: E6, os: windows-latest, script: samples/consumers/powershell/run-e6.ps1 }
    steps:
      - uses: actions/checkout@v5

      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: runtimes/go/go.mod
          cache-dependency-path: runtimes/go/go.sum

      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - if: matrix.language == 'typescript'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - if: matrix.language == 'powershell'
        name: Pester 5 or later
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - uses: actions/download-artifact@v4
        with:
          name: feeds
          path: artifacts/feeds

      - name: The consumer, from the feeds alone
        shell: pwsh
        run: |
          pwsh -NoProfile -File ${{ matrix.script }} -NoPack
          if ($LASTEXITCODE) { throw 'the ${{ matrix.label }} consumer failed on the packages' }

  # E10: on a pull request, or a push that is no release, each public registry's
  # publish step runs as a dry run and reports what it would publish. Nothing
  # reaches a registry: no credential is given, and dotnet nuget push and the
  # Gallery publish are not called at all (scripts/publish/Publish-Package.ps1).
  publish-dry-run:
    name: Publish to ${{ matrix.registry }}, dry run (E10)
    needs: [packages, version]
    # version runs only on a push to main: on a pull request it is skipped, which would skip this job too.
    if: ${{ !cancelled() && needs.packages.result == 'success' && (github.event_name == 'pull_request' || needs.version.outputs.release != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        registry: [github, nuget, npm, crates, psgallery]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - name: What would be published, and what the registry already has
        shell: pwsh
        run: |
          # github: the owner's GitHub Packages registries, prepared (renamed, amended) and not pushed.
          if ('${{ matrix.registry }}' -eq 'github') { pwsh -NoProfile -File scripts/publish/Publish-GitHubPackages.ps1 -DryRun }
          else { pwsh -NoProfile -File scripts/publish/Publish-Package.ps1 -Registry ${{ matrix.registry }} -DryRun }
          if ($LASTEXITCODE) { throw 'the ${{ matrix.registry }} dry run failed' }

  # D16, DEC-P10: the public registries, after every gate and the release
  # environment's approval, each step skipping a version its registry has.
  # Only the registries the repository variable PUBLIC_REGISTRIES names (true
  # for all, or a list such as nuget,npm,crates), each set up first
  # (docs/packages/implementation.md, section 6); none while it is empty.
  publish:
    name: Publish to ${{ matrix.registry }}
    needs: [build, spec, runtime-typescript, runtime-go, runtime-rust, runtime-csharp, runtime-powershell, providers-csharp, providers-go,
      providers-rust, providers-typescript, providers-powershell, divergence, integration, workflow, version, packages, consumers]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.registries != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      # Trusted publishing: npm, nuget.org and crates.io exchange the run's OIDC token for a short-lived key.
      id-token: write
    env:
      # A step's if cannot read a secret; it reads the environment.
      CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        registry: ${{ fromJSON(needs.version.outputs.registries) }}
    steps:
      - uses: actions/checkout@v5

      - if: matrix.registry == 'npm'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm trusted publishing needs npm 11.5.1 or later.
      - if: matrix.registry == 'npm'
        run: npm install --global npm@latest

      - if: matrix.registry == 'nuget'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - if: matrix.registry == 'nuget'
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - if: matrix.registry == 'crates'
        uses: dtolnay/rust-toolchain@stable

      # crates.io's trusted publishing is set on a crate that exists: until
      # then (the first publish) the release environment's CRATES_IO_TOKEN
      # stands in, and the OIDC exchange is skipped. Delete the secret once the
      # trusted publisher is set.
      - if: matrix.registry == 'crates' && env.CRATES_IO_TOKEN == ''
        id: crates
        uses: rust-lang/crates-io-auth-action@v1

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - name: Publish (a version the registry has is skipped)
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token || env.CRATES_IO_TOKEN }}
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          # npm's first publish: trusted publishing is set on a package that
          # exists, so the first one uses the release environment's NPM_TOKEN
          # (the .npmrc setup-node wrote reads it). Delete the secret once the
          # trusted publisher is set; without it npm uses the run's OIDC token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pwsh -NoProfile -File scripts/publish/Publish-Package.ps1 -Registry ${{ matrix.registry }}
          if ($LASTEXITCODE) { throw 'publishing to ${{ matrix.registry }} failed' }

  publish-github-packages:
    name: Push the C# packages, the PowerShell module and the npm package to GitHub Packages
    needs: [build, spec, runtime-typescript, runtime-go, runtime-rust, runtime-csharp, runtime-powershell, providers-csharp, providers-go,
      providers-rust, providers-typescript, providers-powershell, divergence, integration, workflow, version, packages, consumers]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The registries of the repository's owner; the run's own token may write
      # to them. Smartpcr.BddSuite, Smartpcr.BddSuite.Testing and BddSuite (its nuspec given
      # this repository's URL) on the NuGet feed, @bdd-suite/runtime as
      # @<owner>/bdd-suite-runtime on the npm registry, which takes only the
      # owner's scope. A version a registry holds is skipped, so a release can
      # be run again. No symbol server: the .snupkg files go to the release.
      - name: Push (a version the registry already has is skipped)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pwsh -NoProfile -File scripts/publish/Publish-GitHubPackages.ps1
          if ($LASTEXITCODE) { throw 'pushing to GitHub Packages failed' }

  release:
    name: Release v${{ needs.version.outputs.version }}
    needs: [build, spec, runtime-typescript, runtime-go, runtime-rust, runtime-csharp, runtime-powershell, providers-csharp, providers-go,
      providers-rust, providers-typescript, providers-powershell, divergence, integration, workflow, version, packages, consumers,
      publish-github-packages, publish]
    # publish is skipped while the public registries are off; every other need must have passed.
    if: ${{ !cancelled() && needs.version.outputs.release == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TAG: v${{ needs.version.outputs.version }}
      VSIX: bdd-suite-${{ needs.version.outputs.version }}.vsix
      # The public registries the publish jobs put the packages on, as a JSON array ([] for none).
      PUBLIC: ${{ needs.version.outputs.registries }}
    steps:
      # Only the files the release notes read the runtime versions from.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: runtimes

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: The package is the one this run built, at this version
        run: sha256sum --check "$VSIX.sha256"

      # D12, DEC-S09: the notes name what a consumer pinning this tag gets.
      - name: Release notes list the runtime versions
        run: |
          ts=$(node -p "require('./runtimes/typescript/package.json').version")
          api=$(node -p "/apiVersion = '([^']+)'/.exec(require('fs').readFileSync('runtimes/typescript/src/index.ts', 'utf8'))[1]")
          rs=$(sed -n 's/^version = "\(.*\)"/\1/p' runtimes/rust/Cargo.toml | head -1)
          # The module's own ModuleVersion, not its RequiredModules entry's.
          ps=$(sed -n "s/^ *ModuleVersion *= *'\(.*\)'.*/\1/p" runtimes/powershell/BddSuite/BddSuite.psd1)
          tick='`'
          {
            echo "## Runtimes in this release"
            echo
            echo "Install the packages by version, or pin this tag (for example as a git submodule) to get the format spec, the corpus and these runtimes together."
            echo
            echo "| Runtime | Where | Version |"
            echo "| --- | --- | --- |"
            echo "| Go module ${tick}github.com/${GITHUB_REPOSITORY}/runtimes/go${tick} | the tag ${tick}runtimes/go/$TAG${tick}: ${tick}go get github.com/${GITHUB_REPOSITORY}/runtimes/go@$TAG${tick} | $TAG |"
            echo "| C# ${tick}Smartpcr.BddSuite${tick}, ${tick}Smartpcr.BddSuite.Testing${tick} | GitHub Packages, ${tick}https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json${tick} (a token with read:packages), and this release's assets | $rs |"
            echo "| Rust crate ${tick}suiterun${tick} | this release's asset ${tick}suiterun-$rs.crate${tick}, or a git dependency on this tag | $rs |"
            echo "| TypeScript ${tick}@bdd-suite/runtime${tick} | GitHub Packages as ${tick}@${GITHUB_REPOSITORY_OWNER}/bdd-suite-runtime${tick} (${tick}npm install @bdd-suite/runtime@npm:@${GITHUB_REPOSITORY_OWNER}/bdd-suite-runtime@$ts${tick}, the ${tick}@${GITHUB_REPOSITORY_OWNER}${tick} scope at ${tick}https://npm.pkg.github.com${tick} with a token with read:packages), or this release's asset ${tick}bdd-suite-runtime-$ts.tgz${tick} | $ts (lint API $api) |"
            echo "| PowerShell module ${tick}BddSuite${tick} | GitHub Packages, the same NuGet feed as C# (${tick}Register-PSResourceRepository${tick} it, then ${tick}Install-PSResource BddSuite${tick} with a token with read:packages; powershell-yaml from the Gallery), or this release's asset ${tick}BddSuite.$ps.nupkg${tick} | $ps |"
            echo
            # D16: each package on its public registry, once the publish jobs put it there.
            if [ -n "$PUBLIC" ] && [ "$PUBLIC" != "[]" ]; then
              echo "### On the public registries"
              echo
              echo "| Package | Registry page |"
              echo "| --- | --- |"
              case "$PUBLIC" in *'"nuget"'*)
                echo "| ${tick}Smartpcr.BddSuite${tick} $rs | https://www.nuget.org/packages/Smartpcr.BddSuite/$rs |"
                echo "| ${tick}Smartpcr.BddSuite.Testing${tick} $rs | https://www.nuget.org/packages/Smartpcr.BddSuite.Testing/$rs |" ;;
              esac
              case "$PUBLIC" in *'"npm"'*) echo "| ${tick}@bdd-suite/runtime${tick} $ts | https://www.npmjs.com/package/@bdd-suite/runtime/v/$ts |" ;; esac
              case "$PUBLIC" in *'"crates"'*) echo "| ${tick}suiterun${tick} $rs | https://crates.io/crates/suiterun/$rs |" ;; esac
              case "$PUBLIC" in *'"psgallery"'*) echo "| ${tick}BddSuite${tick} $ps | https://www.powershellgallery.com/packages/BddSuite/$ps |" ;; esac
              echo "| Go module | https://pkg.go.dev/github.com/${GITHUB_REPOSITORY}/runtimes/go@$TAG |"
              echo
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: GitHub release with the .vsix and its SHA-256 (creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" "$VSIX.sha256" packages/* --clobber
          else
            gh release create "$TAG" "$VSIX" "$VSIX.sha256" packages/* --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi

      # D12, DEC-S09: Go resolves a module in a subdirectory only from a tag with that prefix.
      - name: Tag the Go module at the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          go_tag="runtimes/go/$TAG"
          release_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$go_tag" --jq .object.sha 2> /dev/null); then
            echo "$go_tag already exists at $existing."
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$go_tag" -f sha="$release_sha" > /dev/null
            existing=$release_sha
            echo "Created $go_tag at $release_sha."
          fi
          # E7: both tags name the same commit.
          if [ "$existing" != "$release_sha" ]; then
            echo "::error::$go_tag is at $existing, but $TAG is at $release_sha."
            exit 1
          fi

  # E11 (docs/packages, K8): after a release to the public registries, a fresh
  # runner with no local feed and no runtimes/ (the checkout holds the consumer
  # samples and the publish scripts only) waits until each registry serves the
  # version, then builds and runs that language's consumer from it.
  verify-registries:
    name: ${{ matrix.label }} consumer from ${{ matrix.registry }} (E11)
    needs: [version, release]
    if: needs.version.outputs.release == 'true' && needs.version.outputs.registries != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.verify) }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            samples/consumers
            scripts/publish

      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: samples/consumers/go/go.mod
          cache: false

      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - if: matrix.language == 'typescript'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - if: matrix.language == 'powershell'
        name: Pester 5 or later
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Wait until ${{ matrix.registry }} serves the version (60 minutes at most)
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/publish/Wait-Published.ps1 -Registry ${{ matrix.registry }}
          if ($LASTEXITCODE) { throw '${{ matrix.registry }} does not serve the version' }

      - name: The consumer, from ${{ matrix.registry }} alone
        shell: pwsh
        run: |
          pwsh -NoProfile -File ${{ matrix.script }} -FromRegistry
          if ($LASTEXITCODE) { throw 'the ${{ matrix.label }} consumer failed on ${{ matrix.registry }}' }
