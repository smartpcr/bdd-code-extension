# Build, test and package the extension on every push to main and every pull
# request; release it when a push to main carries a new version.
#
# Releasing is automatic: bump `version` in package.json and push to main.
# When the build passes and no tag v<version> exists yet, the release job
# publishes the very .vsix this run built and tested to the Visual Studio
# Marketplace, then creates the GitHub release v<version> (which creates the
# tag) with the .vsix and its SHA-256. A push that keeps the version only
# builds and tests.
#
# Publishing uses no stored token (Azure DevOps personal access tokens, PATs,
# are retired on 2026-12-01): the release job signs in to Microsoft Entra ID
# as a user-assigned managed identity, through GitHub's OIDC token and a
# federated credential on that identity, and `vsce publish --azure-credential`
# publishes as the identity, which the Marketplace publisher has as a member.
# It needs the repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID and
# AZURE_SUBSCRIPTION_ID; the README's "Releasing" section sets them up, and
# marketplace-identity.yml prints the identity's Marketplace id to add to the
# publisher.
#
# The release job runs in the `marketplace` environment, so required reviewers
# set on that environment approve each release first. Re-running a failed
# release is safe: a version already on the Marketplace is skipped, and an
# existing GitHub release gets its files replaced.
#
# The extension builds and its demo and integration suite run on Windows, where
# it is developed and used; both are self-contained (the integration suite runs
# against samples/workspace, whose bindings it builds from runtimes/).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests (100% coverage of core, config and tools)
        run: npm run test:unit

      - name: Package (.vsix, its .sha256, and a check of what the archive holds)
        run: npm run package

      - name: Demo end to end (installs the .vsix into a fresh VS Code and drives it)
        run: npm run test:demo

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          # Both under out/, so the artifact holds them at its root.
          path: |
            out/bdd-suite-*.vsix
            out/bdd-suite-*.vsix.sha256
          if-no-files-found: error

  spec:
    name: Core spec and corpus schemas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: The generator's YAML module
        shell: pwsh
        run: Install-Module powershell-yaml -Scope CurrentUser -Force

      - name: Schema tests (the core, imports, duplicates, cycles, extensions)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'spec/Schema.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Every committed generated schema is current
        shell: pwsh
        run: |
          foreach ($catalog in @('spec/core.catalog.yaml', 'conformance/schema/actions.catalog.yaml', 'runtimes/typescript/example/schema/actions.catalog.yaml',
                                'runtimes/go/example/schema/actions.catalog.yaml', 'runtimes/rust/example/schema/actions.catalog.yaml',
                                'runtimes/csharp/Bdd.Suite.Example/schema/actions.catalog.yaml', 'runtimes/powershell/example/schema/actions.catalog.yaml')) {
            pwsh -NoProfile -File spec/Build-Schema.ps1 -Catalog $catalog -Check
            if ($LASTEXITCODE) { throw "$catalog's generated schema is stale" }
          }

  runtime-typescript:
    name: TypeScript runtime (unit, corpus, extension example)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtimes/typescript
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtimes/typescript/package-lock.json

      - run: npm ci

      - name: Build, unit tests, the whole corpus, coverage gates
        run: npm test

  runtime-go:
    name: Go runtime (unit, corpus, extension example)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtimes/go
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtimes/go/go.mod
          cache-dependency-path: runtimes/go/go.sum

      - run: go vet ./...

      - name: Unit tests, the whole corpus, the extension example
        run: go test ./...

  runtime-rust:
    name: Rust runtime (unit, corpus, extension example)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtimes/rust
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtimes/rust

      - name: Unit tests, the whole corpus, the extension example
        run: cargo test

  runtime-csharp:
    name: C# runtime (unit, corpus, extension example)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtimes/csharp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet build Bdd.Suite.sln --nologo

      - name: Unit tests, the whole corpus, the extension example
        run: dotnet test Bdd.Suite.sln --no-build --nologo

  runtime-powershell:
    name: PowerShell runtime (unit, corpus, extension example)
    # Windows: where this runtime is developed and verified.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Pester 5 and the YAML module the suite reader mirrors (0.4.12)
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force

      - name: Runtime tests, the whole corpus, the extension example
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'runtimes/powershell'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $config

  integration:
    name: Extension integration suite against samples/workspace
    # E4: the extension in a real VS Code against the sample workspace, whose
    # five bindings are built from this commit's runtimes. No os-context.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtimes/go/go.mod
          cache-dependency-path: runtimes/go/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: The PowerShell modules the PowerShell binding needs
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module powershell-yaml -RequiredVersion 0.4.12 -Scope CurrentUser -Force

      - run: npm ci

      - name: Integration suite (builds the sample's bindings first)
        run: npm run test:integration

  divergence:
    name: The corpus catches a divergent runtime (Go, TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtimes/go/go.mod
          cache-dependency-path: runtimes/go/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runtimes/typescript/package-lock.json

      - name: Inject a case-sensitive equals into each runtime; its corpus must fail, then the file is restored
        shell: pwsh
        run: |
          foreach ($binding in 'go', 'typescript') {
            pwsh -NoProfile -File conformance/Assert-DivergenceIsCaught.ps1 -Binding $binding
            if ($LASTEXITCODE) { throw "the divergence check failed for $binding" }
          }
          git diff --exit-code -- runtimes

  version:
    name: Is this version released?
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new; it is released once the build passes."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release v${{ needs.version.outputs.version }}
    needs: [build, spec, runtime-typescript, runtime-go, runtime-rust, runtime-csharp, runtime-powershell, divergence, integration, version]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: marketplace
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      # GitHub's OIDC token, which Entra ID exchanges for the identity's token.
      id-token: write
    env:
      TAG: v${{ needs.version.outputs.version }}
      VSIX: bdd-suite-${{ needs.version.outputs.version }}.vsix
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: The package is the one this run built, at this version
        run: sha256sum --check "$VSIX.sha256"

      - name: The publishing identity is configured
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::The repository variable $v is not set; nothing was published. See the README's Releasing section."
              exit 1
            fi
          done

      - name: Sign in to Microsoft Entra ID as the publishing identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@3 publish --packagePath "$VSIX" --skip-duplicate --azure-credential

      - name: GitHub release with the .vsix and its SHA-256 (creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" "$VSIX.sha256" --clobber
          else
            gh release create "$TAG" "$VSIX" "$VSIX.sha256" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
